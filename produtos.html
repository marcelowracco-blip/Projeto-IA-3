<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos — Lojão do Lar Lírio dos Vales</title>
  <meta name="description" content="Explore toda a nossa linha de móveis, decoração, iluminação e muito mais.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-container">
      <div class="logo">
        <a href="index.html" aria-label="Voltar à página inicial">
          <h1>Lírio dos Vales</h1>
          <span>Lojão do Lar</span>
        </a>
      </div>
      <nav class="nav-menu" id="navMenu" aria-label="Menu principal">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="produtos.html" class="active">Produtos</a></li>
          <li><a href="contato.html">Contato</a></li>
          <li>
            <a href="#" id="cartIconBtn" aria-label="Carrinho de compras">
              <span data-icon="cart"></span>
              Carrinho
              <span id="cartCount" class="cart-count">0</span>
            </a>
          </li>
        </ul>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </header>

  <!-- PAGE HERO -->
  <div class="page-hero" aria-label="Cabeçalho da página">
    <h1>Nossos Produtos</h1>
    <p>Encontre tudo que seu lar precisa em um só lugar</p>
  </div>

  <!-- PRODUTOS -->
  <main>
    <div class="container section">
      <div class="filtros-wrapper">
        <h2>Catálogo completo</h2>
        <div class="filter-bar" role="group" aria-label="Filtrar por categoria">
          <button class="filter-btn active" data-cat="todos">Todos</button>
          <button class="filter-btn" data-cat="moveis">Móveis</button>
          <button class="filter-btn" data-cat="decoracao">Decoração</button>
          <button class="filter-btn" data-cat="cozinha">Cozinha</button>
          <button class="filter-btn" data-cat="iluminacao">Iluminação</button>
        </div>
      </div>
      <div class="products-grid" id="produtosGrid"></div>
    </div>
  </main>

  <!-- MODAL CARRINHO -->
  <div id="cartModal" class="cart-modal" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
    <div class="cart-modal-content">
      <div class="cart-header">
        <h3 id="cartTitle">
          <span data-icon="bag"></span>
          Meu Carrinho
        </h3>
        <button class="close-cart" aria-label="Fechar carrinho">&times;</button>
      </div>
      <ul id="cartItemsList" class="cart-items-list"></ul>
      <div class="cart-footer">
        <div class="cart-total-row">
          <span>Total</span>
          <span id="cartTotal">R$ 0,00</span>
        </div>
        <div class="cart-buttons">
          <button id="clearCartBtn" class="btn-ghost">Limpar</button>
          <button id="closeCartBtn" class="btn-dark">Continuar comprando</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer" role="contentinfo">
    <div class="container footer-inner">
      <div class="footer-brand">
        <div class="logo">
          <h1>Lírio dos Vales</h1>
          <span>Lojão do Lar</span>
        </div>
      </div>
      <p class="footer-copy">&copy; 2025 Lojão do Lar Lírio dos Vales</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    carregarTodosProdutos();
    inicializarFiltros();
  </script>
</body>
</html>
